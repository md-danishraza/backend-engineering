syntax = "proto3";

package news;

// The Service Definition
service NewsService {
    // A simple RPC: Client sends a request, gets one response
    rpc GetAllNews (Empty) returns (NewsList) {}
    
    // Unary RPC: Get specific news
    rpc GetNews (NewsId) returns (NewsItem) {}
}

// Data Structures (Messages)
message Empty {}

message NewsId {
    string id = 1;
}

message NewsItem {
    string id = 1;
    string title = 2;
    string body = 3;
    string postImage = 4;
}

message NewsList {
    repeated NewsItem news = 1; // "repeated" means Array
}